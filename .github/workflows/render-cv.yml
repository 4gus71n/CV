name: Render CV and Deploy

on:
  push:
    branches: [main]
    paths:
      - "rendercv.yaml"
      - "assets/img/profile.jpg"
      - ".github/workflows/render-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-cv
  cancel-in-progress: true

jobs:
  render-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RenderCV
        run: pip install "rendercv[full]"

      - name: Render CV
        run: rendercv render rendercv.yaml

      - name: Copy generated files to repo root
        run: |
          cp rendercv_output/agustin_tomas_larghi_CV.html CV.html
          cp rendercv_output/agustin_tomas_larghi_CV.md CV.md
          cp rendercv_output/agustin_tomas_larghi_CV.pdf CV.pdf
          ls -la CV.html CV.md CV.pdf

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CV.html CV.md CV.pdf
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Render CV from rendercv.yaml [skip ci]"
            git push
          fi
